site_name: Wizard Docs
site_description: Documentation for Wizard, a local-first autonomous data analysis agent.
site_url: https://wizard-aia.github.io/docs/
repo_url: https://github.com/Wizard-AIA/Wizard-w2
repo_name: Wizard-AIA/Wizard-w2
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: sky
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: sky
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Wizard-AIA
    - icon: fontawesome/brands/x-twitter
      link: https://x.com

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - The wizard CLI: getting-started/cli.md
  - Concepts:
      - Architecture & Control Plane: concepts/architecture.md
      - Task Routing & Tiers: concepts/routing-and-tiers.md
      - Data Modes & Privacy: concepts/data-modes-and-privacy.md
      - Execution & Sandboxing: concepts/execution-and-sandboxing.md
      - Permissions & Consent: concepts/permissions-and-consent.md
      - Skills: concepts/skills.md
      - Connectors & Streaming: concepts/connectors.md
  - Guides:
      - Exploratory Data Analysis: guides/exploratory-data-analysis.md
      - Model Training: guides/model-training.md
      - Exporting an Analysis: guides/exporting-an-analysis.md
      - Installing a Skill from GitHub: guides/installing-a-skill.md
  - Reference:
      - Configuration: reference/configuration.md
      - API & Event Protocol: reference/api.md
  - Troubleshooting:
      - Edge Cases & Gotchas: troubleshooting/edge-cases.md
  - Contributing: contributing.md
  - Changelog: changelog.md
